name: Security governance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate direct dependency contract
        run: npm run validate:dependencies

      # Critical findings block even when they are only in build/dev tooling.
      - name: Block critical vulnerabilities in the complete tree
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=critical --json | tee npm-audit-critical.json

      # High/critical findings in code shipped to the browser remain a hard gate.
      # Dev-only tooling is recorded separately below so an asset-tool advisory
      # does not make every website source commit look like a production breach.
      - name: Block high vulnerabilities in production dependencies
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json | tee npm-audit-runtime.json

      - name: Record full high-severity audit for dev/build tooling
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-full.json
          status=$?
          echo "Full dependency audit exit code: ${status}"
          echo "Non-zero here is retained as evidence; runtime high and all critical findings are blocked by earlier steps."
          exit 0

      - name: Generate CycloneDX SBOM
        if: always()
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Upload dependency security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-${{ github.sha }}
          path: |
            npm-audit-critical.json
            npm-audit-runtime.json
            npm-audit-full.json
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
