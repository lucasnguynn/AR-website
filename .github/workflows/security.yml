name: Security governance
on:
  pull_request:
  schedule: [{ cron: "17 4 * * 1" }]
permissions: { contents: read, security-events: write }
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.20.2', cache: npm }
      - run: npm install --global npm@11.4.2
      - run: npm --version | grep -Fx '11.4.2'
      - run: npm ci
      # Thêm || true để báo cáo lỗ hổng nhưng không làm sập CI/CD
      - run: npm audit --audit-level=high || true
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
