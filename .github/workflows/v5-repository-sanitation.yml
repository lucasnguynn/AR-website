name: V5 repository sanitation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Reproduce the clean quality build twice
        shell: bash
        run: |
          set -euo pipefail
          lock_hash="$(sha384sum package-lock.json)"
          for pass in 1 2; do
            rm -rf node_modules dist
            npm ci
            test "$(sha384sum package-lock.json)" = "$lock_hash"
            npm run quality
            sha384sum dist/integrity-manifest.json > "/tmp/integrity-${pass}.sha384"
          done
          cmp /tmp/integrity-1.sha384 /tmp/integrity-2.sha384
          git diff --exit-code -- package-lock.json
