name: V5 repository sanitation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
        
      - name: 1. Remove dead dependencies
        run: |
          npm uninstall @tensorflow/tfjs-backend-webgpu @tensorflow/tfjs-core @tensorflow/tfjs-converter @tensorflow/tfjs @svenflow/micro-handpose || true
          
      - name: 2. Untrack generated artifacts
        run: |
          git rm -r --cached node_modules dist coverage .cache || true
          echo "node_modules/" >> .gitignore
          echo "dist/" >> .gitignore
          
      - name: 3. Regenerate package-lock.json
        run: npm install
        
      - name: 4. Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .gitignore
          git commit -m "chore: sanitize tracked directories, remove TFJS, and regenerate lockfile" || echo "Nothing to sanitize"
          git push origin main
