name: Post-deploy evidence
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Cloudflare Pages deployment URL
        required: true
        type: string
permissions: { contents: read }
jobs:
  deployed-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Verify HTTP headers and deployed Worker/WASM SHA-384
        run: node scripts/verify-deployment-headers.mjs "${{ inputs.deployment_url }}"
      - name: Inspect response headers
        run: curl --fail --show-error --head "${{ inputs.deployment_url }}" | tee response-headers.txt
      - name: Lighthouse thresholds
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json --collect.url="${{ inputs.deployment_url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-evidence
          path: |
            response-headers.txt
            lhci-results
