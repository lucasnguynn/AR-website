name: GitHub Pages post-deploy evidence

on:
  workflow_run:
    workflows: ['Quality + GitHub Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-post-deploy
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    env:
      DEPLOYMENT_URL: https://lucasnguynn.github.io/AR-website/

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for GitHub Pages propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 "$DEPLOYMENT_URL" >/dev/null; then
              echo "GitHub Pages is reachable."
              exit 0
            fi
            echo "Waiting for deployment propagation ($attempt/12)..."
            sleep 10
          done
          echo "GitHub Pages did not become reachable in time."
          exit 1

      - name: Verify deployed meta-CSP, integrity manifest and critical assets
        run: node scripts/verify-pages-deployment.mjs "$DEPLOYMENT_URL"

      - name: Capture platform response headers
        run: curl --fail --show-error --location --dump-header response-headers.txt --output /dev/null "$DEPLOYMENT_URL"

      - name: Lighthouse thresholds
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json --collect.url="$DEPLOYMENT_URL"

      - name: Upload post-deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-post-deploy-${{ github.sha }}
          path: |
            response-headers.txt
            lhci-results
          if-no-files-found: ignore
          retention-days: 14
