name: Asset Pipeline

on:
  push:
    paths:
      - 'public/models/**/*.glb'
      - 'scripts/compress-model.js'
      - '.github/workflows/asset-pipeline.yml'
  workflow_dispatch:

jobs:
  optimize-ar-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip usd-core

      - name: Compress GLB models
        run: npm run compress-model

      - name: Convert GLB models to USDZ
        run: |
          python - <<'PY'
          from pathlib import Path
          from pxr import Usd, UsdGeom, Sdf

          model_dir = Path('public/models')
          for glb_path in model_dir.glob('*.glb'):
              usdz_path = glb_path.with_suffix('.usdz')
              stage = Usd.Stage.CreateNew(str(usdz_path.with_suffix('.usda')))
              root = UsdGeom.Xform.Define(stage, '/Root')
              stage.SetDefaultPrim(root.GetPrim())
              asset = root.GetPrim().GetReferences()
              asset.AddReference(Sdf.AssetPath(str(glb_path)))
              stage.Save()
              Usd.ZipFileWriter.CreateNew(str(usdz_path)).AddFile(str(usdz_path.with_suffix('.usda')), 'scene.usda').Save()
              usdz_path.with_suffix('.usda').unlink(missing_ok=True)
              print(f'Created {usdz_path}')
          PY

      - name: Upload optimized AR assets
        uses: actions/upload-artifact@v4
        with:
          name: optimized-ar-assets
          path: |
            public/models/**/*.glb
            public/models/**/*.usdz
