name: Semantic Ring Asset Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'assets/models/raw/**/*.glb'
      - 'scripts/generate-lod.js'
      - 'scripts/compress-model.js'
      - 'scripts/semanticize-ring-glb.mjs'
      - 'scripts/audit-ring-assets.mjs'
      - '.github/workflows/asset-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: semantic-ring-assets
  cancel-in-progress: true

jobs:
  build-ring-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect semantic source model
        id: source
        shell: bash
        run: |
          if [ -f assets/models/raw/nhan.glb ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Semantic source found: assets/models/raw/nhan.glb"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No assets/models/raw/nhan.glb yet. Pipeline is ready and will exit without modifying runtime assets."
          fi

      - name: Setup Node.js
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        if: steps.source.outputs.present == 'true'
        run: npm ci

      - name: Build semantic HIGH / MEDIUM / LOW assets
        if: steps.source.outputs.present == 'true'
        run: npm run build:assets

      - name: Upload generated asset evidence
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-ring-assets-${{ github.sha }}
          path: |
            public/models/nhan-high.glb
            public/models/nhan-medium.glb
            public/models/nhan-low.glb
          retention-days: 14

      - name: Commit validated runtime LODs
        if: steps.source.outputs.present == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add \
            public/models/nhan-high.glb \
            public/models/nhan-medium.glb \
            public/models/nhan-low.glb

          if git diff --cached --quiet; then
            echo "Validated LOD assets are unchanged."
            exit 0
          fi

          git commit -m "ci: publish validated semantic ring LODs"
          git push

          # Pushes made with GITHUB_TOKEN do not normally start a new push workflow.
          # Explicit workflow_dispatch keeps the generated-asset commit behind the same quality/deploy gate.
          gh workflow run quality.yml --ref main
