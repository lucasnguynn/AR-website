# FILE: .github/workflows/asset-pipeline.yml
name: Asset Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/assets/models/**/*.glb'
      - 'public/models/**/*.glb'
      - 'scripts/glb_to_usdz.py'
      - 'scripts/generate-sri.js'
      - '.github/workflows/asset-pipeline.yml'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install usd-core Pillow numpy
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g @gltf-transform/cli
      - name: Compress GLB
        run: |
          mkdir -p public/models
          for f in src/assets/models/*.glb public/models/*.glb; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .glb)
            gltf-transform optimize "$f" "public/models/${name}.glb" \
              --compress draco --texture-compress ktx2
          done
      - name: Convert to USDZ
        run: for f in public/models/*.glb; do python3 scripts/glb_to_usdz.py "$f"; done
      - name: Generate SRI
        run: node scripts/generate-sri.js public/models/
      - name: Commit
        run: |
          git config user.email "actions@github.com" && git config user.name "GitHub Actions"
          git add public/models/ src/generated/
          git diff --staged --quiet || (git commit -m "ci: assets compressed + USDZ [skip ci]" && git push)
# VERIFY: echo "Asset Pipeline converts GLB assets to optimized GLB, USDZ, and SRI manifests"
