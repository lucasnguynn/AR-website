name: Asset Pipeline

on:
  push:
    paths:
      - 'public/models/**/*.glb'
      - 'scripts/compress-model.js'
      - '.github/workflows/asset-pipeline.yml'
  workflow_dispatch:

jobs:
  optimize-ar-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip usd-core

      - name: Compress GLB models
        run: npm run compress-model

      - name: Convert GLB models to USDZ
        run: |
          python - <<'PY'
          from pathlib import Path
          from pxr import Usd, UsdGeom

          model_dir = Path('public/models')
          for glb_path in model_dir.glob('*.glb'):
              usdz_path = glb_path.with_suffix('.usdz')
              usda_path = usdz_path.with_suffix('.usda')
              
              # 1. Tạo file cấu hình USD
              stage = Usd.Stage.CreateNew(str(usda_path))
              root = UsdGeom.Xform.Define(stage, '/Root')
              stage.SetDefaultPrim(root.GetPrim())
              
              # 2. Sửa lỗi ép kiểu: Truyền thẳng chuỗi string (tên file) thay vì Sdf.AssetPath
              refs = root.GetPrim().GetReferences()
              refs.AddReference(glb_path.name)
              stage.Save()
              
              # 3. Đóng gói USDZ: Phải gói cả file cấu hình (.usda) VÀ file 3D (.glb) vào chung
              zip_writer = Usd.ZipFileWriter.CreateNew(str(usdz_path))
              zip_writer.AddFile(str(usda_path), 'scene.usda')
              zip_writer.AddFile(str(glb_path), glb_path.name)
              zip_writer.Save()
              
              usda_path.unlink(missing_ok=True)
              print(f'Created {usdz_path}')
          PY

      - name: Upload optimized AR assets
        uses: actions/upload-artifact@v4
        with:
          name: optimized-ar-assets
          path: |
            public/models/**/*.glb
            public/models/**/*.usdz
