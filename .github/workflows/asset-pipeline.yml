name: Semantic Ring Asset Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'assets/models/raw/**/*.glb'
      - 'scripts/generate-lod.js'
      - 'scripts/compress-model.js'
      - 'scripts/semanticize-ring-glb.mjs'
      - 'scripts/audit-ring-assets.mjs'
      - '.github/workflows/asset-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: semantic-ring-assets
  cancel-in-progress: true

jobs:
  build-ring-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Required by `gh workflow run` after the generated-asset commit.
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect semantic source model
        id: source
        shell: bash
        run: |
          if [ -f assets/models/raw/nhan.glb ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Semantic source found: assets/models/raw/nhan.glb"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No assets/models/raw/nhan.glb yet."
            echo "Pipeline is ready and exits without changing runtime assets."
          fi

      - name: Setup Node.js
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        if: steps.source.outputs.present == 'true'
        run: npm ci

      - name: Validate semantic source
        if: steps.source.outputs.present == 'true'
        run: npm run validate:source-model

      - name: Generate and validate HIGH / MEDIUM / LOW
        if: steps.source.outputs.present == 'true'
        run: npm run build:assets

      - name: Upload generated asset evidence
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-ring-assets-${{ github.sha }}
          path: |
            public/models/nhan-high.glb
            public/models/nhan-medium.glb
            public/models/nhan-low.glb
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated runtime LODs
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add \
            public/models/nhan-high.glb \
            public/models/nhan-medium.glb \
            public/models/nhan-low.glb

          if git diff --cached --quiet; then
            echo "Validated LOD assets are unchanged."
            exit 0
          fi

          git commit -m "ci: publish validated semantic ring LODs"

          # Rebase if another web edit landed while the asset job was running.
          git pull --rebase origin main
          git push origin HEAD:main

          # A GITHUB_TOKEN-authenticated push normally does not trigger another
          # push workflow. Dispatch the canonical quality/deploy gate explicitly.
          gh workflow run quality.yml --ref main

