name: Quality + GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Sync pinned MediaPipe runtime assets
        run: npm run sync:mediapipe

      - name: Validate package and lockfile contract
        run: npm run validate:dependencies

      - name: Validate runtime asset contract
        run: npm run validate:assets

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: CSP static contract
        run: npm run lint:csp

      - name: Privacy boundary audit
        run: npm run audit:privacy

      - name: Production build + integrity verification
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Upload integrity evidence
        if: always() && hashFiles('dist/integrity-manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          path: dist/integrity-manifest.json
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
