name: Quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      
      # 1. Chạy bộ Test TRƯỚC KHI tải mô hình (để bài test ngắt an toàn được Pass)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run lint:csp
      - run: npm run audit:privacy
      
      # 2. Tải mô hình AI SAU KHI test xong
      - name: Download Large ML Models
        run: |
          mkdir -p public/models/depth
          curl -L -o public/models/depth/depth_anything_v2_small.onnx https://huggingface.co/onnx-community/Depth-Anything-V2-Small/resolve/main/onnx/model.onnx
          
      # 3. Validate và Build (lúc này mô hình đã sẵn sàng)
      - run: npm run validate:assets
      - run: npm run build
      - run: npm run check:bundle
      
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { name: production-dist, path: dist }
      - uses: actions/upload-artifact@v4
        with: { name: quality-evidence, path: "dist/integrity-manifest.json" }

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: production-dist, path: dist }
      - name: Deploy immutable build to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
      - name: Verify production headers and compiled asset integrity
        run: node scripts/verify-deployment-headers.mjs "${{ steps.deploy.outputs.deployment-url }}" dist/integrity-manifest.json
