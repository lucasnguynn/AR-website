name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
# ... các dòng trước đó ...
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # SỬA DÒNG NÀY: Thay vì dùng npm ci, hãy dùng npm install để tự sinh lại lock file khớp với package.json
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
# ... các dòng sau đó ...

      - name: Create 404.html for SPA routing
        # GitHub Pages serves a 404 page for any URL that doesn't match a file.
        # For a SPA deployed at /AR-website/, direct URL access (e.g. refreshing
        # a deep route) would 404. Copying index.html as 404.html lets GitHub Pages
        # serve the app shell for any unmatched path, allowing client-side routing to work.
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
