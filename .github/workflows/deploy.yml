name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # FIX: Use 'npm ci' with cache for reproducible, faster builds.
          # 'npm install' ignores the lockfile and can silently upgrade packages,
          # leading to build drift between local and CI environments.
          cache: 'npm'

      - name: Install dependencies
        # FIX: Use 'npm ci' instead of 'npm install'.
        # 'npm ci' enforces the lockfile exactly — no surprise dependency upgrades.
        run: npm ci

      - name: Build
        # FIX: Use 'npm run build' instead of 'npx vite build'.
        # The package.json 'build' script runs: compress-3d && tsc && vite build
        # Calling 'npx vite build' directly SKIPS TypeScript checking (tsc) and
        # the model compression pipeline. Using 'npm run build' runs the full chain.
        #
        # The compress-3d script safely no-ops if assets/models/raw/ doesn't exist
        # (exits 0 with a warning), so this won't break CI when there are no raw models.
        run: npm run build

      - name: Create 404.html for SPA routing
        # GitHub Pages serves a 404 page for any URL that doesn't match a file.
        # For a SPA deployed at /AR-website/, direct URL access (e.g. refreshing
        # a deep route) would 404. Copying index.html as 404.html lets GitHub Pages
        # serve the app shell for any unmatched path, allowing client-side routing to work.
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
