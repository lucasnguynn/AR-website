# FILE: .github/workflows/deploy.yml
name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (zero warnings)
        run: npx eslint src/ --max-warnings=0 --ext .ts,.tsx

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Build
        run: npx vite build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ASSET_SECRET: ${{ secrets.ASSET_SECRET }}
          NODE_ENV: production

      - name: Sign asset manifest
        run: node scripts/sign-assets.js
        env:
          ASSET_SECRET: ${{ secrets.ASSET_SECRET }}

      - name: Generate SRI hashes
        run: node scripts/generate-sri.js

      - name: Bundle size check
        run: node scripts/check-bundle-size.js

      - name: Rebuild with SRI
        run: npx vite build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_ENV: production

      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
# VERIFY: Push to main runs type-check, lint, unit tests, build, signing, SRI, bundle checks, and deploys GitHub Pages.
