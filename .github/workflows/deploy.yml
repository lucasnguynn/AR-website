name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  # Allows manual trigger from the Actions tab
  workflow_dispatch:

# Write access is required so peaceiris/actions-gh-pages can push to gh-pages.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      # Pushes ./dist to the gh-pages branch and enables GitHub Pages.
      # The GITHUB_TOKEN secret is provided automatically by Actions —
      # no manual PAT is required.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Keeps deployment history readable; set to true to squash if
          # you want a single-commit history on the gh-pages branch.
          force_orphan: false
